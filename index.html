
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>幸运老虎机</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px 14px 30px;background:radial-gradient(circle at top,#4a176c,#100b20 72%);color:white;font-family:Arial,sans-serif;text-align:center}
.app{max-width:440px;margin:auto}
h1{color:#ffdc59;font-size:32px;margin:10px}
.sub{color:#d2c3ed;font-size:13px;margin-bottom:18px}
.panel{background:#19132e;border:2px solid #6944a1;border-radius:20px;padding:16px;margin:14px 0;box-shadow:0 8px 20px #0004}
.balance{font-size:14px;color:#cfc2ef}
.balance strong{display:block;font-size:30px;color:#ffdc59;margin-top:6px}
.label{margin:10px 0;color:#e2d7ff;font-size:14px}
.prizes{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.prize{border:2px solid #655080;background:#29213e;color:white;border-radius:12px;padding:14px 2px;font-size:19px;font-weight:bold}
.prize.active{border-color:#ffdc59;background:#63401a;box-shadow:0 0 12px #ffc74b}
.reels{display:flex;gap:8px;background:#090713;border:4px solid #e5b846;border-radius:16px;padding:12px 8px}
.reel{flex:1;min-width:0;height:88px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff6df,#e9d4ad);color:#29203c;border-radius:10px;font-size:26px;font-weight:bold}
.reel.spin{animation:shake .12s infinite alternate}
@keyframes shake{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.multis{display:flex;gap:8px}
.multi{flex:1;border:1px solid #766196;background:#2b2243;color:white;border-radius:10px;padding:12px 2px;font-weight:bold}
.multi.active{background:#ffcc48;color:#321c00;border-color:#fff1a5}
.betrow{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px}
.betrow button{width:40px;height:40px;border:0;border-radius:10px;font-size:24px}
.bet{font-size:22px;color:#ffdc59;font-weight:bold}
.spinbtn{width:100%;padding:16px;border:2px solid #fff0a0;border-radius:15px;background:linear-gradient(#4fe96b,#079642);color:white;font-size:23px;font-weight:bold;box-shadow:0 4px #075c30}
.spinbtn:disabled{opacity:.55}
.msg{min-height:48px;padding-top:15px;color:#ffdf65;font-size:18px;font-weight:bold;line-height:1.5}
.rules{font-size:13px;color:#d4c9e8;line-height:1.9}
button{cursor:pointer;touch-action:manipulation}
.reset{background:transparent;color:#cfc2ef;border:1px solid #655080;padding:8px 12px;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<h1>🎰 幸运老虎机</h1>
<div class="sub">BAR · 葡萄 · 柠檬 · 777</div>

<div class="panel">
 <div class="balance">我的虚拟金币
 <strong id="coins">1000</strong></div>
</div>

<div class="panel">
 <div class="label">① 选择中奖奖项</div>
 <div class="prizes">
  <button class="prize active" data-symbol="BAR">BAR</button>
  <button class="prize" data-symbol="🍇">🍇</button>
  <button class="prize" data-symbol="🍋">🍋</button>
  <button class="prize" data-symbol="777">777</button>
 </div>
</div>

<div class="panel">
 <div class="label">② 开奖区域</div>
 <div class="reels">
  <div class="reel" id="r0">BAR</div>
  <div class="reel" id="r1">🍇</div>
  <div class="reel" id="r2">777</div>
 </div>

 <div class="label">③ 选择下注倍率</div>
 <div class="multis">
  <button class="multi active" data-mult="1">1 倍</button>
  <button class="multi" data-mult="2">2 倍</button>
  <button class="multi" data-mult="5">5 倍</button>
  <button class="multi" data-mult="10">10 倍</button>
 </div>

 <div class="betrow">
  <button id="minus">−</button>
  <div>下注注码<br><span class="bet" id="bet">10</span></div>
  <button id="plus">＋</button>
 </div>

 <button class="spinbtn" id="spin">🎰 开始游戏</button>
 <div class="msg" id="msg">选择奖项和倍率，开始游戏！</div>
</div>

 <div class="panel">
  <div class="label">🎁 每日签到奖励</div>
  <div style="font-size:14px;color:#d7c7f7;line-height:1.8">
    每日签到领取 100 金币<br>
    连续签到额外奖励 50 金币/天，最多额外 300 金币
  </div>
  <button id="checkin" class="spinbtn"
          style="font-size:18px;margin-top:12px">
    🎁 领取今日奖励
  </button>
  <div id="checkinMsg" class="msg"></div>
 </div>
<div class="panel rules">
 <b>中奖规则</b><br>
 出现 0 个或 1 个所选奖项：未中奖<br>
 出现 2 个所选奖项：奖金 = 注码 × 3<br>
 出现 3 个所选奖项：爆灯！奖金 = 注码 × 5<br>
 注码 = 基础注码 10 × 所选倍率<br>
 奖金含中奖注码返还，仅使用虚拟金币。<br>
 <button class="reset" id="reset">重置金币</button>
</div>
</div>

<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const symbols=["BAR","🍇","🍋","777"];
const $=id=>document.getElementById(id);
let data={};
try{data=JSON.parse(localStorage.getItem("slotGame")||"{}")||{};}catch(e){}
let coins=Number.isFinite(data.coins)&&data.coins>=0?data.coins:1000;
let selected=symbols.includes(data.selected)?data.selected:"BAR";
let multiplier=[1,2,5,10].includes(data.multiplier)?data.multiplier:1;
let spinning=false;
const baseBet=10;
const bet=()=>baseBet*multiplier;

function save(){
 try{localStorage.setItem("slotGame",JSON.stringify({coins,selected,multiplier}));}catch(e){}
}
function render(){
 $("coins").textContent=Math.floor(coins).toLocaleString();
 $("bet").textContent=bet();
 document.querySelectorAll(".prize").forEach(b=>b.classList.toggle("active",b.dataset.symbol===selected));
 document.querySelectorAll(".multi").forEach(b=>b.classList.toggle("active",Number(b.dataset.mult)===multiplier));
 $("spin").disabled=spinning||coins<bet();
 $("spin").textContent=spinning?"开奖中...":"🎰 开始游戏";
 $("minus").disabled=spinning||multiplier===1;
 $("plus").disabled=spinning||multiplier===10;
}
document.querySelectorAll(".prize").forEach(b=>b.onclick=()=>{
 if(spinning)return;
 selected=b.dataset.symbol;save();render();
});
document.querySelectorAll(".multi").forEach(b=>b.onclick=()=>{
 if(spinning)return;
 multiplier=Number(b.dataset.mult);save();render();
});
$("minus").onclick=()=>{
 multiplier=Math.max(1,multiplier===10?5:multiplier===5?2:1);
 save();render();
};
$("plus").onclick=()=>{
 multiplier=Math.min(10,multiplier===1?2:multiplier===2?5:10);
 save();render();
};

$("spin").onclick=()=>{
 if(spinning||coins<bet())return;
 spinning=true;
 const stake=bet();
 coins-=stake;
 save();render();
 $("msg").textContent="祝你好运！滚轮正在旋转...";
 const result=Array.from({length:3},()=>symbols[Math.floor(Math.random()*symbols.length)]);
 let ticks=0;
 const timer=setInterval(()=>{
  for(let i=0;i<3;i++){
   $("r"+i).textContent=symbols[Math.floor(Math.random()*symbols.length)];
   $("r"+i).classList.add("spin");
  }
  ticks++;
  if(ticks>=14){
   clearInterval(timer);
   result.forEach((s,i)=>{
    $("r"+i).textContent=s;
    $("r"+i).classList.remove("spin");
   });
   const count=result.filter(s=>s===selected).length;
   let reward=0;
   if(count===2)reward=stake*3;
   if(count===3)reward=stake*5;
   coins+=reward;
   spinning=false;
   if(count===3)$("msg").textContent="💥 爆灯！奖金 "+reward+" 金币！";
   else if(count===2)$("msg").textContent="🎉 恭喜中奖！奖金 "+reward+" 金币！";
   else $("msg").textContent="未中奖，再接再厉！";
   if(coins<10)$("msg").textContent+=" 金币不足，无法继续下注。";
   save();render();
  }
 },100);
};

$("reset").onclick=()=>{
 if(spinning)return;
 if(!confirm("确定将虚拟金币重置为 1000 吗？"))return;
 coins=1000;save();render();
 $("msg").textContent="金币已重置！";
};
// 每日签到：本地保存日期和连续签到天数
const DAY_MS = 86400000;
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
};

let checkinData = {};
try {
  checkinData = JSON.parse(
    localStorage.getItem("slotCheckin") || "{}"
  ) || {};
} catch (e) {}

function updateCheckinButton() {
  const btn = document.getElementById("checkin");
  const msg = document.getElementById("checkinMsg");
  if (!btn || !msg) return;

  if (checkinData.lastDate === todayKey()) {
    btn.disabled = true;
    btn.textContent = "✅ 今日已签到";
    msg.textContent = "今日奖励已领取，明天再来！";
  } else {
    btn.disabled = false;
    btn.textContent = "🎁 领取今日奖励";
    msg.textContent = "今日可领取 100 金币及连续签到奖励";
  }
}

document.getElementById("checkin").onclick = () => {
  const today = todayKey();

  if (checkinData.lastDate === today) {
    updateCheckinButton();
    return;
  }

  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const y = yesterday.getFullYear() + "-" +
    String(yesterday.getMonth() + 1).padStart(2, "0") + "-" +
    String(yesterday.getDate()).padStart(2, "0");

  let streak = checkinData.lastDate === y
    ? (Number(checkinData.streak) || 0) + 1
    : 1;

  streak = Math.min(streak, 7);

  const bonus = 100 + Math.min((streak - 1) * 50, 300);
  coins += bonus;

  checkinData = { lastDate: today, streak: streak };
  try {
    localStorage.setItem(
      "slotCheckin", JSON.stringify(checkinData)
    );
  } catch (e) {}

  save();
  render();
  updateCheckinButton();

  document.getElementById("checkinMsg").textContent =
    "签到成功！获得 " + bonus +
    " 金币，连续签到第 " + streak + " 天！";
};

updateCheckinButton();
 render();
</script>
</body>
</html>
