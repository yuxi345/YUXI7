
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>幸运老虎机</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;color:#fff;text-align:center;
 font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#35206d,#100d29 70%);
 padding:20px 14px 35px
}
.app{max-width:460px;margin:auto}
h1{font-size:36px;color:#ffd75a;text-shadow:0 3px #a64a00;margin:12px 0}
.sub{color:#c8bbff;margin-bottom:22px}
.panel{
 background:linear-gradient(145deg,#24184e,#12152f);
 border:2px solid #6550b8;border-radius:22px;
 padding:18px;margin:14px 0;box-shadow:0 8px 22px #0005
}
.balance{font-size:16px;color:#d8ceff}
.balance strong{display:block;font-size:30px;color:#ffdc55;margin-top:5px}
.reels{
 display:flex;gap:8px;justify-content:center;
 background:#090a1a;border:5px solid #eebc42;
 border-radius:18px;padding:12px 7px
}
.reel{
 flex:1;min-width:0;background:#fff4d8;color:#23133d;
 border-radius:12px;height:104px;display:flex;
 justify-content:center;align-items:center;font-size:48px;
 box-shadow:inset 0 0 10px #a47a40
}
.reel.spin{animation:shake .12s infinite alternate}
@keyframes shake{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.betrow{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0}
.smallbtn{width:48px;height:45px;border:0;border-radius:13px;font-size:26px;font-weight:bold}
.bet{font-size:21px;min-width:90px;color:#ffdc55}
button{cursor:pointer;touch-action:manipulation}
.spinbtn{
 width:100%;border:2px solid #ffe47c;border-radius:18px;
 background:linear-gradient(#41e66b,#079b42);
 color:white;font-weight:bold;font-size:24px;padding:17px;
 box-shadow:0 5px #075c31;margin-top:8px
}
.spinbtn:disabled{opacity:.55}
.msg{min-height:30px;font-size:18px;color:#ffe16c;margin-top:15px}
.rules{font-size:13px;line-height:1.8;color:#c9c3e8}
.reset{background:transparent;border:1px solid #8173b9;color:#ddd;border-radius:10px;padding:9px 15px;margin-top:8px}
</style>
</head>
<body>
<div class="app">
  <h1>🎰 幸运老虎机</h1>
  <div class="sub">LUCKY SPIN · 虚拟金币小游戏</div>

  <div class="panel">
    <div class="balance">🪙 我的金币
      <strong id="coins">1000</strong>
    </div>
  </div>

  <div class="panel">
    <div class="reels">
      <div class="reel" id="r0">🍒</div>
      <div class="reel" id="r1">💎</div>
      <div class="reel" id="r2">7️⃣</div>
    </div>

    <div class="betrow">
      <button class="smallbtn" id="minus" aria-label="减少下注">−</button>
      <div>下注金额<br><div class="bet">🪙 <span id="bet">10</span></div></div>
      <button class="smallbtn" id="plus" aria-label="增加下注">＋</button>
    </div>

    <button class="spinbtn" id="spin">🎰 开始旋转</button>
    <div class="msg" id="msg">祝你好运！</div>
  </div>

  <div class="panel rules">
    <b>🎁 游戏规则</b><br>
    三个图案相同：获得下注额的 5 倍奖励（含返还下注）<br>
    两个图案相同：获得下注额的 2 倍奖励（含返还下注）<br>
    没有相同图案：本次下注不返还<br>
    <br>本游戏仅使用虚拟金币，不涉及真实货币。
    <br><button class="reset" id="reset">重置游戏数据</button>
  </div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const symbols = ["🍒","🍋","🔔","💎","👑","7️⃣"];
const $ = id => document.getElementById(id);

let saved;
try { saved = JSON.parse(localStorage.getItem("slotSave") || "{}"); }
catch(e) { saved = {}; }

let coins = Number.isFinite(saved.coins) ? Math.max(0, saved.coins) : 1000;
let bet = Number.isFinite(saved.bet) ? Math.max(10, saved.bet) : 10;
let spinning = false;

function save() {
  try {
    localStorage.setItem("slotSave", JSON.stringify({coins, bet}));
  } catch(e) {}
}

function render() {
  $("coins").textContent = Math.floor(coins).toLocaleString();
  $("bet").textContent = bet;
  $("minus").disabled = spinning || bet <= 10;
  $("plus").disabled = spinning || bet >= 500;
  $("spin").disabled = spinning || coins < bet;
  $("spin").textContent = spinning ? "旋转中..." : "🎰 开始旋转";
}

$("minus").onclick = () => {
  if (spinning) return;
  bet = Math.max(10, bet - 10);
  save(); render();
};

$("plus").onclick = () => {
  if (spinning) return;
  bet = Math.min(500, bet + 10);
  save(); render();
};

$("spin").onclick = () => {
  if (spinning || coins < bet) return;

  spinning = true;
  coins -= bet;
  save();
  render();
  $("msg").textContent = "滚轮旋转中...";

  const final = [
    symbols[Math.floor(Math.random() * symbols.length)],
    symbols[Math.floor(Math.random() * symbols.length)],
    symbols[Math.floor(Math.random() * symbols.length)]
  ];

  let ticks = 0;
  const timer = setInterval(() => {
    for (let i = 0; i < 3; i++) {
      $("r" + i).textContent =
        symbols[Math.floor(Math.random() * symbols.length)];
      $("r" + i).classList.add("spin");
    }

    ticks++;
    if (ticks >= 12) {
      clearInterval(timer);

      final.forEach((s, i) => {
        $("r" + i).textContent = s;
        $("r" + i).classList.remove("spin");
      });

      const counts = {};
      final.forEach(s => counts[s] = (counts[s] || 0) + 1);
      const maxSame = Math.max(...Object.values(counts));

      let reward = 0;
      if (maxSame === 3) reward = bet * 5;
      else if (maxSame === 2) reward = bet * 2;

      coins += reward;
      spinning = false;

      if (reward > 0) {
        $("msg").textContent = maxSame === 3
          ? "🎉 JACKPOT！赢得 " + reward + " 金币！"
          : "✨ 恭喜！赢得 " + reward + " 金币！";
      } else {
        $("msg").textContent = "再试一次，好运正在路上！";
      }

      if (coins < 10) {
        $("msg").textContent += " 金币不足，请重置游戏。";
      }

      save();
      render();
    }
  }, 110);
};

$("reset").onclick = () => {
  if (spinning) return;
  if (!confirm("确定将金币重置为 1000 吗？")) return;
  coins = 1000;
  bet = 10;
  save();
  render();
  $("msg").textContent = "金币已重置，开始游戏吧！";
};

render();
</script>
</body>
</html>
