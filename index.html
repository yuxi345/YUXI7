<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎰 幸运老虎机</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:18px 12px;
  font-family:Arial,"Microsoft YaHei",sans-serif;
  color:#fff;text-align:center;
  background:linear-gradient(160deg,#180d36,#45105c,#170c32);
}
.game{max-width:420px;margin:auto}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:27px;margin:15px 0;color:#ffd86b}
button,select{border:0;border-radius:12px;padding:12px;font-size:16px}
button{cursor:pointer;font-weight:bold}
.iconbtn{background:#ffffff20;color:white}
.card{
  margin-top:15px;padding:18px 12px;border-radius:22px;
  background:linear-gradient(145deg,#6d248b,#32104e);
  border:2px solid #e8bb52;
  box-shadow:0 0 25px #a52cff55;
}
.coins{font-size:23px;color:#ffe17a;font-weight:bold}
.reels{display:flex;gap:9px;margin:20px 0}
.reel{
  flex:1;height:92px;display:grid;place-items:center;
  font-size:35px;background:#fff9df;color:#2a1642;
  border:4px solid #ffce55;border-radius:14px;
  box-shadow:inset 0 0 12px #d9a83b;
}
.reel.spinning{animation:shake .12s infinite alternate}
@keyframes shake{to{transform:translateY(-4px)}}
.controls{display:flex;gap:8px;align-items:center;justify-content:center}
select{background:white;color:#24113d}
#spin{
  width:100%;margin-top:14px;padding:16px;
  background:linear-gradient(90deg,#ffe477,#ffad27);
  color:#45134b;font-size:21px;
}
#spin:disabled{opacity:.55}
.secondary{background:#ffffff20;color:white;margin:5px}
.message{min-height:48px;margin-top:12px;line-height:1.6}
.info{font-size:13px;line-height:1.8;color:#e1d5f5}
#popup{
  display:none;position:fixed;inset:0;background:#000b;
  align-items:center;justify-content:center;padding:20px;
}
.popupbox{
  width:100%;max-width:330px;padding:28px;border-radius:22px;
  background:linear-gradient(145deg,#79249b,#35104e);
  border:2px solid #ffd15b;
}
.popupbox h2{color:#ffe276}
#popupAmount{font-size:28px;color:#ffe276}
</style>
</head>
<body>
<div class="game">
  <div class="top">
    <button class="iconbtn" id="sound">🔊 音效开</button>
    <button class="iconbtn" id="reset">重置金币</button>
  </div>

  <h1>🎰 幸运老虎机</h1>

  <div class="card">
    <div>我的虚拟金币</div>
    <div class="coins" id="coins">1000</div>

    <div class="reels">
      <div class="reel" id="r0">🍇</div>
      <div class="reel" id="r1">🍋</div>
      <div class="reel" id="r2">777</div>
    </div>

    <div class="controls">
      <span>注码：</span>
      <select id="bet">
        <option value="10">10 金币</option>
        <option value="20">20 金币</option>
        <option value="50">50 金币</option>
        <option value="100">100 金币</option>
      </select>
    </div>

    <button id="spin">🎰 开始游戏</button>
    <div class="message" id="message">选好注码，试试你的运气！</div>
  </div>

  <div class="card">
    <h3>📅 每日签到</h3>
    <p id="checkinInfo">每天签到领取 100 虚拟金币</p>
    <button class="secondary" id="checkin">🎁 立即签到</button>
  </div>

  <div class="card info">
    <b>游戏规则</b><br>
    2 个相同图案：返还下注并获得下注额 × 3 的奖金总额<br>
    3 个相同图案：返还下注并获得下注额 × 5 的奖金总额<br>
    其他组合：本局下注不返还<br>
    每日签到：100 金币<br>
    仅供娱乐，金币保存在当前浏览器中。
  </div>
</div>

<div id="popup">
  <div class="popupbox">
    <h2 id="popupTitle">🎉 恭喜中奖！</h2>
    <p id="popupText">幸运降临</p>
    <div id="popupAmount">+30 金币</div>
    <button class="secondary" id="closePopup">继续游戏</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const symbols = ["🍇","🍋","🍒","BAR","777"];
let saved = {};
try {
  saved = JSON.parse(localStorage.getItem("slotGameSave") || "{}") || {};
} catch(e) {}

let coins = Number.isFinite(saved.coins) ? saved.coins : 1000;
let soundOn = saved.soundOn !== false;
let audioCtx = null;
let busy = false;

function save() {
  localStorage.setItem("slotGameSave", JSON.stringify({
    coins, soundOn
  }));
  $("coins").textContent = coins;
  $("sound").textContent = soundOn ? "🔊 音效开" : "🔇 音效关";
}

function unlockAudio() {
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    audioCtx = audioCtx || new AudioContextClass();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch(e) {}
}

function tone(freq, duration = 0.12, type = "sine", volume = 0.08) {
  if (!soundOn) return;
  try {
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;

    audioCtx = audioCtx || new AudioContextClass();

    const playSound = () => {
      if (!soundOn) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(volume, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(
        0.001, audioCtx.currentTime + duration
      );

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    };

    if (audioCtx.state === "suspended") {
      audioCtx.resume().then(playSound).catch(console.error);
    } else {
      playSound();
    }
  } catch(e) {
    console.error("音效播放失败", e);
  }
}

function fanfare(jackpot) {
  const notes = jackpot
    ? [523,659,784,1047,784,1047]
    : [523,659,784];

  notes.forEach((freq,i) => {
    setTimeout(() => tone(freq,0.22,"triangle",0.09), i*150);
  });
}

function randomSymbol() {
  return symbols[Math.floor(Math.random()*symbols.length)];
}

function showPopup(title,text,amount) {
  $("popupTitle").textContent = title;
  $("popupText").textContent = text;
  $("popupAmount").textContent = amount;
  $("popup").style.display = "flex";
}

function closePopup() {
  $("popup").style.display = "none";
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve,ms));
}

async function spin() {
  if (busy) return;

  unlockAudio();

  const bet = Number($("bet").value);
  if (coins < bet) {
    $("message").textContent = "金币不足，请签到领取金币。";
    tone(180,0.2,"sawtooth");
    return;
  }

  busy = true;
  $("spin").disabled = true;
  coins -= bet;
  save();

  $("message").textContent = "🎰 正在旋转……";
  tone(220,0.3,"sawtooth",0.06);

  const reels = [$("r0"),$("r1"),$("r2")];
  const results = [];

  for (let i=0;i<3;i++) {
    reels[i].classList.add("spinning");

    const duration = 900 + i*550;
    const start = Date.now();

    while (Date.now()-start < duration) {
      reels[i].textContent = randomSymbol();
      tone(300 + Math.random()*250,0.035,"square",0.018);
      await sleep(90);
    }

    results[i] = randomSymbol();
    reels[i].textContent = results[i];
    reels[i].classList.remove("spinning");
    tone(600,0.1,"triangle",0.06);
  }

  const counts = {};
  results.forEach(s => counts[s] = (counts[s] || 0)+1);
  const maxCount = Math.max(...Object.values(counts));

  if (maxCount === 3) {
    const prize = bet*5;
    coins += prize;
    $("message").textContent = "💥 爆灯！三个图案完全相同！";
    fanfare(true);
    save();
    showPopup("💥 爆灯大奖！",results.join("　"),"+"+prize+" 金币");
  } else if (maxCount === 2) {
    const prize = bet*3;
    coins += prize;
    $("message").textContent = "🎉 恭喜！两个图案相同！";
    fanfare(false);
    save();
    showPopup("🎉 恭喜中奖！",results.join("　"),"+"+prize+" 金币");
  } else {
    $("message").textContent = "差一点！再试一次吧。";
    tone(240,0.3,"sine",0.06);
    save();
  }

  busy = false;
  $("spin").disabled = false;
  save();
}

$("spin").addEventListener("click",spin);

$("sound").addEventListener("click",() => {
  soundOn = !soundOn;
  save();
  if (soundOn) {
    unlockAudio();
    tone(880,0.18,"triangle",0.1);
  }
});

$("closePopup").addEventListener("click",closePopup);
$("popup").addEventListener("click",e => {
  if (e.target === $("popup")) closePopup();
});

$("reset").addEventListener("click",() => {
  if (!confirm("确定重置金币为 1000 吗？")) return;
  coins = 1000;
  save();
  $("message").textContent = "金币已重置。";
});

function getToday() {
  const d = new Date();
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}

function updateCheckin() {
  let data = {};
  try {
    data = JSON.parse(localStorage.getItem("slotCheckin") || "{}") || {};
  } catch(e) {}

  const done = data.date === getToday();
  $("checkin").disabled = done;
  $("checkin").textContent = done ? "✅ 今日已签到" : "🎁 立即签到";
  $("checkinInfo").textContent = done
    ? "今天已领取奖励，明天再来！"
    : "每天签到领取 100 虚拟金币";
}

$("checkin").addEventListener("click",() => {
  if ($("checkin").disabled) return;

  unlockAudio();
  coins += 100;
  save();

  localStorage.setItem("slotCheckin",JSON.stringify({
    date:getToday()
  }));

  updateCheckin();
  $("message").textContent = "签到成功，获得 100 虚拟金币！";
  tone(880,0.2,"triangle",0.1);
});

save();
updateCheckin();
</script>
</body>
</html>
