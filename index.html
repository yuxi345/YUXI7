
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>矿星计划</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body {
  margin: 0; padding: 20px;
  background: #101522; color: white;
  font-family: Arial, sans-serif; text-align: center;
}
.card {
  background: #1b263b; padding: 20px;
  margin: 15px 0; border-radius: 18px;
}
.coins { color: #ffc857; font-size: 32px; }
.rock { font-size: 100px; padding: 15px; cursor: pointer; }
button {
  border: 0; border-radius: 12px;
  padding: 13px; margin: 5px;
  background: #ffc857; color: #222;
  font-weight: bold;
}
</style>
</head>
<body>
<h2>⛏️ 矿星计划</h2>
<p id="username">欢迎矿工</p>

<div class="card">
  <p>我的金币</p>
  <div class="coins" id="coins">0 🪙</div>
  <p id="power">每次挖矿：1 金币</p>
</div>

<div class="card">
  <div class="rock" id="rock">🪨</div>
  <button onclick="mine()">⛏️ 开始挖矿</button>
  <p id="total">累计挖矿：0 次</p>
</div>

<div class="card">
  <h3>🛠️ 装备商店</h3>
  <button onclick="upgrade()">升级矿镐（50金币）</button>
  <button onclick="buyMiner()">购买矿机（100金币）</button>
  <p id="miners">自动矿机：0 台</p>
</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const user = tg?.initDataUnsafe?.user;
if (user) {
  document.getElementById('username').textContent =
    '欢迎矿工 ' + user.first_name;
}

let coins = 0;
let power = 1;
let total = 0;
let miners = 0;
let level = 1;

function render() {
  document.getElementById('coins').textContent =
    coins + ' 🪙';
  document.getElementById('power').textContent =
    '每次挖矿：' + power + ' 金币';
  document.getElementById('total').textContent =
    '累计挖矿：' + total + ' 次';
  document.getElementById('miners').textContent =
    '自动矿机：' + miners + ' 台';
}

function mine() {
  coins += power;
  total++;
  render();
  tg?.HapticFeedback?.impactOccurred('light');
}

function upgrade() {
  const cost = level * 50;
  if (coins < cost) {
    alert('金币不足，请继续挖矿！');
    return;
  }
  coins -= cost;
  power++;
  level++;
  render();
}

function buyMiner() {
  const cost = (miners + 1) * 100;
  if (coins < cost) {
    alert('金币不足，请继续挖矿！');
    return;
  }
  coins -= cost;
  miners++;
  render();
}

setInterval(() => {
  if (miners > 0) {
    coins += miners;
    total += miners;
    render();
  }
}, 1000);

render();
</script>
</body>
</html>
